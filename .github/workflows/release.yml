name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Releases are signed with the project's self-signed certificate so every version keeps the
      # same code identity (macOS privacy permissions survive updates). It is not a Developer ID,
      # so Gatekeeper still needs the quarantine flag cleared — the Homebrew cask and install.sh do that.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::error::MACOS_SIGN_P12_BASE64 is not set; refusing to publish a release with a different code identity."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # codesign only finds the (untrusted) identity when the keychain is in the user search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=GrammarBar Self-Signed Code Signing" >> "$GITHUB_ENV"

      - name: Build app bundle
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Verify bundle
        run: |
          lipo -info GrammarBar.app/Contents/MacOS/GrammarBar
          codesign --verify --verbose GrammarBar.app
          codesign -d -r- GrammarBar.app 2>&1 | tee /dev/stderr \
            | grep -q 'certificate root = H"1bd487de5e740619d23adf616a675eff9b27a1c3"'

      - name: Package
        run: |
          ditto -c -k --keepParent GrammarBar.app GrammarBar.zip
          shasum -a 256 GrammarBar.zip | tee GrammarBar.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-run: keep the published assets and use their checksum so the cask matches what users download.
            echo "Release $GITHUB_REF_NAME already exists; using its published checksum."
            gh release download "$GITHUB_REF_NAME" --pattern GrammarBar.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" GrammarBar.zip GrammarBar.zip.sha256 \
              --title "GrammarBar ${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: sarifmiaa/homebrew-tap
          CASK_FILE: Casks/grammarbar.rb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping Homebrew cask update."
            exit 0
          fi
          if [[ "$VERSION" == *-* ]]; then
            echo "Pre-release $VERSION; skipping Homebrew cask update."
            exit 0
          fi

          SHA256="$(cut -d ' ' -f 1 GrammarBar.zip.sha256)"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap
          sed -i '' -E \
            -e "s/^  version \".*\"$/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"${SHA256}\"/" \
            "$CASK_FILE"

          if git diff --quiet; then
            echo "Cask already at ${VERSION}."
            exit 0
          fi
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(grammarbar): update to ${VERSION}"
          git push

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true; fi
